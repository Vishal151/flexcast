[project]
name = "flexcast"
version = "0.0.0"
description = "Forecast-driven scheduler for home batteries on GB market data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fsspec>=2026.9.0",
    "highspy>=1.15.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "pulp>=4.1.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.0",
    "typer>=0.27.3",
]

[project.scripts]
flexcast = "flexcast.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "respx>=0.23.1",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
mypy_path = "src"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "flexcast.*"
strict = true

[[tool.mypy.overrides]]
module = ["fsspec", "fsspec.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the compose stack (make up)",
    "live: hits real upstream APIs; opt-in",
]

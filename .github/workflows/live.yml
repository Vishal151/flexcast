# Weekly smoke test against the real Elexon and Octopus APIs. Kept out of PR checks: an upstream
# outage shouldn't block a merge, but a changed API should be noticed, so failures open an issue.
name: Live upstream smoke

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write  # only to report a failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: make live
      - name: Open or update an issue (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live upstream smoke test failing"
          body="The weekly live test against Elexon/Octopus failed: $RUN_URL"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
